name: agent

# Hourly at :15, giving the window a quarter of an hour to close
# before the tick looks at it.
# Cron is UTC; Israel is UTC+3 in summer, so 04:15-20:15 UTC covers
# 07:15-23:15 local. In winter (UTC+2) it shifts an hour earlier -
# harmless, because run.js enforces active hours in the real timezone.
#
# GitHub runs schedules on a best-effort basis and drops them freely:
# on 27 Aug it skipped six consecutive hourly slots while manual
# dispatches ran fine. One cron an hour therefore means whole hours of
# news are lost, because a window older than MAX_WINDOW_AGE_MIN is
# retired rather than posted.
#
# So: three attempts an hour instead of one. The extra ticks cost
# almost nothing - a tick with nothing unconsumed exits in seconds -
# and run.js is already idempotent about it: it takes the OLDEST
# unconsumed window, honours MIN_MINUTES_BETWEEN_POSTS, and the
# concurrency group below stops two from overlapping.
# No `schedule:` here any more. GitHub's cron is best-effort — it
# skipped ~20 consecutive slots on 27 Aug, which is why the clock moved
# into Supabase — and leaving it in place made it a SECOND, unreliable
# one. A schedule event carries no inputs, so every run it started was
# a digest, never stories; run #86 was its 20:46 UTC slot arriving 57
# minutes late at 00:43 local, where it did nothing but burn a minute
# being told it was outside active hours. Worse, its 05:16 / 12:16 /
# 18:16 UTC slots land INSIDE the digest hours, so it would have posted
# the digest fifteen minutes early and left pg_cron's own dispatch to
# bounce off the minimum gap.
#
# pg_cron dispatches both tracks now: stories at :16, digest at :31.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (build everything, do not publish)'
        type: boolean
        # false, because the Supabase cron dispatches this workflow with
        # no inputs and the API applies these defaults. A default of
        # true would make every scheduled run a silent no-op.
        default: false
      window:
        description: 'Replay a specific window, e.g. 2026-08-26T08:00'
        type: string
      resume:
        description: 'Resume after a pause (retire the failed windows first)'
        type: boolean
        default: false
      review:
        description: 'Render for review only (do not publish)'
        type: boolean
        default: false
      mode:
        description: 'digest = the carousel; stories = the hour as story boards; insights = read the account back, publish nothing; reel = one MP4 to the only surface strangers see'
        type: choice
        options: [digest, stories, insights, reel]
        default: digest
      now:
        description: 'Ignore the digest schedule and post this one now'
        type: boolean
        default: false
      catchup:
        description: 'stories only: tell every hour of TODAY the track still owes, back to back'
        type: boolean
        default: false

# Never let two ticks overlap - they would fight over the same window.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      # The reel is silent.
      #
      # One switch, read by the setup steps AND by the run, so the two
      # cannot drift: with the voice off there is no reason to spend a
      # cold cache pulling a 60MB speech model or a translation model
      # whose only consumer was the speech. Set to '1' and both come
      # back on together.
      REEL_VOICE: '0'
    # 12 was right when a tick was a carousel. A reel installs ffmpeg
    # and python, pulls a voice model on a cold cache, renders twelve
    # boards in two passes and encodes seven video segments — run #368
    # was killed at 12m00s with the mp4 nearly built. The concurrency
    # group already stops two ticks overlapping, so a longer ceiling
    # costs nothing on the runs that finish in a minute.
    timeout-minutes: 25
    # Chromium and its system libraries are already in this image.
    # Installing them per run would double the billed minutes.
    #
    # This tag MUST match the playwright version in package.json
    # exactly. A caret range let npm resolve 1.49.1 -> 1.62.1 while
    # this stayed put, and the browser binary path moved with the
    # library: "Executable doesn't exist at .../chromium_headless_shell-1234".
    # package.json now pins an exact version; bump both together.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      # The one mode that needs a real encoder. The Playwright image
      # ships an ffmpeg built for webm capture, not an H.264 encoder,
      # and reels must be H.264/AAC or Meta refuses the container.
      # Conditional because ~40 ticks a day never touch video and none
      # of them should pay thirty seconds of apt for it.
      # ffmpeg for the encode, python3 for the narrator. The Playwright
      # image ships neither: its ffmpeg is a webm capture build with no
      # H.264 encoder, and it carries node rather than python, which is
      # why the piper step below finished in zero seconds doing nothing
      # at all on its first run.
      - name: ffmpeg and python
        if: inputs.mode == 'reel'
        run: |
          apt-get update -qq
          apt-get install -y -qq ffmpeg python3 python3-pip
          ffmpeg -version | head -1; python3 --version

      # /tmp/piper, not ${{ runner.temp }}.
      #
      # This job runs in a container, and runner.temp is evaluated on
      # the HOST — it expanded to /home/runner/work/_temp, a path that
      # does not exist inside the image, where the mount is /__w/_temp.
      # The piper step below had it as its working-directory, so the
      # step died before its first line and reported success in zero
      # seconds. An absolute path that exists in every image needs no
      # expression to be translated correctly and cannot drift.
      - name: cache the voice
        if: inputs.mode == 'reel' && env.REEL_VOICE != '0'
        uses: actions/cache@v4
        with:
          path: .piper
          key: piper-en_US-lessac-medium-v1

      # The translation model, cached the same way and for the same
      # reason: it is downloaded once and then never again.
      - name: cache the translator
        if: inputs.mode == 'reel' && env.REEL_VOICE != '0'
        uses: actions/cache@v4
        with:
          path: .mt
          key: mt-opus-mul-en-v1

      # The narrator. Piper is a pip package plus a ~60MB voice model
      # from HuggingFace — no key, no cost, no rate limit at 22:06.
      # The step cannot fail the run (a reel with the bed and no voice
      # is still a reel), but it is no longer allowed to fail QUIETLY:
      # `|| true` on every line meant two runs in a row reported
      # success in seven seconds having installed nothing, and the
      # only symptom was the reel hanging later somewhere else.
      # Each stage now says what it did, and the last line is the
      # answer to "is there a voice on this runner or not".
      - name: piper
        if: inputs.mode == 'reel' && env.REEL_VOICE != '0'
        timeout-minutes: 6
        run: |
          set +e
          mkdir -p .piper
          echo "── pip install piper-tts"
          python3 -m pip install --break-system-packages piper-tts 2>&1 | tail -5
          python3 -c "import piper; print('piper importable')" \
            || echo "PIPER NOT IMPORTABLE — the reel will go out with the bed alone"
          if [ -f ".piper/${VOICE}.onnx" ]; then
            echo "── voice model restored from cache"
          else
            echo "── downloading ${VOICE}"
            python3 -m piper.download_voices "${VOICE}" --download-dir .piper 2>&1 | tail -5
          fi
          echo "── .piper now holds:"
          ls -la .piper
          [ -f ".piper/${VOICE}.onnx" ] \
            && echo "VOICE READY" \
            || echo "NO VOICE MODEL — the reel will go out with the bed alone"
          exit 0
        env:
          VOICE: en_US-lessac-medium

      - name: run
        env:
          TZ: Asia/Jerusalem
          # Back to the API: it started working the moment the Instagram
          # account was linked to a Facebook Page, which is a hard
          # requirement we only satisfied on 28 Aug. The browser
          # publisher stays in the tree as the fallback — set the
          # PUBLISHER repo variable to 'browser' to switch back.
          PUBLISHER: ${{ vars.PUBLISHER || 'api' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
          # Which track this tick is. The Supabase cron sends
          # mode=stories on the hour and mode=digest three times a day;
          # a dispatch with no inputs is a digest.
          MODE: ${{ inputs.mode || 'digest' }}
          # ONE board, every ninety minutes — eleven a day instead of
          # fifty-one. Stories reach followers only, so volume there
          # buys nothing until there is an audience to retain; the
          # spacing is set by the cron, this is the belt.
          MAX_STORIES: '1'
          # The rail against a DOUBLE DISPATCH, not a second opinion on
          # the cadence. The cron owns the ninety minutes: its slots are
          # exactly that far apart, so two scheduled stories land 88-92
          # minutes apart whatever this number says.
          #
          # It was 80 — ten minutes of slack — and a story told
          # off-cycle spends all of it. The catch-up posted at 13:28, so
          # the 14:46 tick arrived 78 minutes later and refused itself
          # by two; the whole afternoon went untold. 75 leaves fifteen
          # minutes for start-up jitter and a shifted clock to drift
          # into, and still blocks the duplicate firing it is for, which
          # arrives seconds apart rather than an hour.
          MIN_MINUTES_BETWEEN_STORIES: '75'
          MAX_STORIES_PER_DAY: '14'
          # A story is about the hour it belongs to. More than two
          # windows behind and it is news, not "now".
          MAX_STORY_LAG_WINDOWS: '2'
          # Three digests a day, in Asia/Jerusalem: the morning, half an
          # hour before the US open, and the evening. The hour gate is
          # in run.js, not in the cron expression, because pg_cron
          # thinks in UTC and Israel changes its clocks twice a year.
          DIGEST_HOURS: '8,15,21'
          # ── the reel track ───────────────────────────────
          # One a day, at 17:00 local. Was two; one film that is worth
          # watching beats two that split the same audience, and the
          # reel is now a summary of the day rather than a bulletin of
          # the last few hours — there is only one of those to make.
          # The hour lives here and not in the cron expression for the
          # same reason the digest hours do: pg_cron is UTC and Israel
          # changes its clocks twice a year.
          REEL_HOURS: '17'
          MAX_REELS_PER_DAY: '1'
          # And "the day" means the last twenty-four hours, not since
          # midnight. At five in the afternoon the US session that
          # matters is last night's, and a window starting at midnight
          # would miss all of it.
          REEL_LOOKBACK_HOURS: '24'
          # Hours, not minutes. A reel is the only surface a stranger
          # sees; two of them an hour apart split the same audience
          # across both and teach the ranker that neither held anyone.
          MIN_MINUTES_BETWEEN_REELS: '180'
          # Five beats plus the opener and the close: seven cards, and
          # enough of the day to be a summary rather than a headline.
          REEL_BEATS: '5'
          # The evening reel covers what happened since the afternoon
          # one. Fewer than this many messages in that stretch and there
          # is no second film to make — better one good reel than two
          # thin ones.
          REEL_MIN_MESSAGES: '5'
          # Four beats plus a title and a close: six scenes, ~11s.
          # The name on the reel's original-audio page. Not a track —
          # the API cannot attach Instagram's library music, only label
          # the audio already inside the file. A named audio page is a
          # surface that collects every reel using it; an unnamed one
          # is dead space.
          REEL_AUDIO_NAME: 'מרקט אלרט'
          # ── the voice ────────────────────────────────────
          # English narration over the Hebrew boards. Set to '0' to
          # publish silent reels with the bed alone.
          REEL_VOICE: ${{ env.REEL_VOICE }}
          REEL_VOICE_MODEL: en_US-lessac-medium
          # Relative, resolved from the repo root the run starts in.
          # No workflow expression to be evaluated on the host and
          # then not exist inside the container.
          PIPER_HOME: .piper
          # length-scale is phoneme duration, so below 1 is FASTER.
          # Reels are watched fast and a measured newsreader pace reads
          # as slow on a surface people are scrolling past.
          REEL_VOICE_RATE: '0.95'
          # A narrated scene lasts as long as its sentence; this is the
          # floor for one nobody speaks over.
          # A silent card is held by how long it takes to READ, not by
          # how long it takes to say. 2.0 was the floor under a spoken
          # line; on its own it is faster than a Hebrew headline can be
          # taken in. Seven cards at three seconds is a shade under
          # twenty, which is where a summary reel wants to sit.
          REEL_HOLD_SEC: '3.0'
          REEL_SAY_CLOSE: 'Follow for the U S market, every day.'
          # Ceilings on the two slow paths in voice.js. Narration is
          # optional; without these it is a way for an optional thing
          # to hang the reel that does not need it.
          REEL_VOICE_SETUP_SEC: '120'
          REEL_VOICE_SAY_SEC: '180'
          # ── the translation ──────────────────────────────
          # The one place in this pipeline where a model writes a
          # sentence. It is checked rather than trusted: any English
          # line carrying a digit the Hebrew never had is discarded and
          # the card keeps its structured line. Set to '0' to go back
          # to structured narration everywhere.
          REEL_TRANSLATE: '1'
          # The free translator, on this runner. 45MB of npm and a
          # small model cached beside the voice — no key, no bill, and
          # nothing that can rate-limit a reel at 17:06.
          MT_MODEL: Xenova/opus-mt-mul-en
          MT_CACHE: .mt
          # Optional upgrade, not a requirement. Set this secret and
          # the translator becomes a large model; leave it unset and
          # the free one runs. The guards are identical either way.
          TRANSLATE_MODEL: claude-haiku-4-5-20251001
          TRANSLATE_TIMEOUT_SEC: '45'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IGNORE_SCHEDULE: ${{ inputs.now && '1' || '0' }}
          # Never set by the cron — a catch-up is always a decision.
          CATCHUP: ${{ inputs.catchup && '1' || '0' }}
          # A digest now covers everything since the last one, so the
          # merge-forward should never stop early: it absorbs every
          # closed window up to the one still filling.
          MIN_MESSAGES: '999'
          WINDOW_MINUTES: '60'
          # Windows run XX:15 -> XX+1:15; the tick fires at XX:16.
          WINDOW_OFFSET_MIN: '15'
          # Nothing new for this long, during active hours, and the
          # agent says so in Telegram instead of staying green.
          STALE_SOURCE_HOURS: '8'
          ACTIVE_FROM_HOUR: '7'
          ACTIVE_TO_HOUR: '24'
          MAX_POSTS_PER_DAY: '12'
          # Instagram's web composer starts refusing quietly when posts
          # come too fast. 35 minutes still clears a full backlog inside
          # a trading day and stays well under its patience.
          MIN_MINUTES_BETWEEN_POSTS: '35'
          # 0 = never retire. An unposted window waits its turn no
          # matter how old it is.
          MAX_WINDOW_AGE_MIN: '0'
          # A thin window waits this long for the next hour's news to
          # join it, then posts alone rather than waiting forever.
          WAIT_THIN_MIN: '180'
          PAUSE_AFTER_FAILURES: '2'
          # A pause that never expires is a silently dead agent.
          PAUSE_WINDOW_MIN: '180'
          RESUME: ${{ inputs.resume && '1' || '0' }}
          # Live: scheduled ticks publish on their own. The gate is
          # still here, one checkbox away — tick 'review' on a dispatch
          # to render an artifact without posting, or flip this default
          # to '1' to put every scheduled tick behind it again.
          REVIEW: ${{ inputs.review && '1' || '0' }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_SOURCE_CHANNEL: ${{ secrets.TG_SOURCE_CHANNEL }}
          TG_ALERT_TARGET: me
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: marketalert.il
          # A live instagram.com session, captured by login-ig.js.
          # Treat exactly like a password.
          IG_STORAGE_STATE: ${{ secrets.IG_STORAGE_STATE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: slides
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node src/run.js --ingest ${{ inputs.window && format('--window={0}', inputs.window) || '' }}

      # Only on failure, and only the rendered slides - never .env,
      # never state. Makes a broken deck inspectable after the fact.
      # Always now, not only on failure: the artifact IS the review
      # copy. PNG as well as JPEG - the browser publisher renders PNG.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: |
            out/**/*.png
            out/**/*.jpeg
            out/**/*.mp4
            out/browser/**
          retention-days: 7
          if-no-files-found: ignore
