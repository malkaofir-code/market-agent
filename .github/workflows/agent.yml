name: agent

# Hourly at :15, giving the window a quarter of an hour to close
# before the tick looks at it.
# Cron is UTC; Israel is UTC+3 in summer, so 04:15-20:15 UTC covers
# 07:15-23:15 local. In winter (UTC+2) it shifts an hour earlier -
# harmless, because run.js enforces active hours in the real timezone.
#
# GitHub runs schedules on a best-effort basis and drops them freely:
# on 27 Aug it skipped six consecutive hourly slots while manual
# dispatches ran fine. One cron an hour therefore means whole hours of
# news are lost, because a window older than MAX_WINDOW_AGE_MIN is
# retired rather than posted.
#
# So: three attempts an hour instead of one. The extra ticks cost
# almost nothing - a tick with nothing unconsumed exits in seconds -
# and run.js is already idempotent about it: it takes the OLDEST
# unconsumed window, honours MIN_MINUTES_BETWEEN_POSTS, and the
# concurrency group below stops two from overlapping.
# No `schedule:` here any more. GitHub's cron is best-effort — it
# skipped ~20 consecutive slots on 27 Aug, which is why the clock moved
# into Supabase — and leaving it in place made it a SECOND, unreliable
# one. A schedule event carries no inputs, so every run it started was
# a digest, never stories; run #86 was its 20:46 UTC slot arriving 57
# minutes late at 00:43 local, where it did nothing but burn a minute
# being told it was outside active hours. Worse, its 05:16 / 12:16 /
# 18:16 UTC slots land INSIDE the digest hours, so it would have posted
# the digest fifteen minutes early and left pg_cron's own dispatch to
# bounce off the minimum gap.
#
# pg_cron dispatches both tracks now: stories at :16, digest at :31.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (build everything, do not publish)'
        type: boolean
        # false, because the Supabase cron dispatches this workflow with
        # no inputs and the API applies these defaults. A default of
        # true would make every scheduled run a silent no-op.
        default: false
      window:
        description: 'Replay a specific window, e.g. 2026-08-26T08:00'
        type: string
      resume:
        description: 'Resume after a pause (retire the failed windows first)'
        type: boolean
        default: false
      review:
        description: 'Render for review only (do not publish)'
        type: boolean
        default: false
      mode:
        description: 'digest = the carousel; stories = up to 3 story boards for the last hour'
        type: choice
        options: [digest, stories]
        default: digest
      now:
        description: 'Ignore the digest schedule and post this one now'
        type: boolean
        default: false
      catchup:
        description: 'stories only: tell every hour of TODAY the track still owes, back to back'
        type: boolean
        default: false

# Never let two ticks overlap - they would fight over the same window.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Chromium and its system libraries are already in this image.
    # Installing them per run would double the billed minutes.
    #
    # This tag MUST match the playwright version in package.json
    # exactly. A caret range let npm resolve 1.49.1 -> 1.62.1 while
    # this stayed put, and the browser binary path moved with the
    # library: "Executable doesn't exist at .../chromium_headless_shell-1234".
    # package.json now pins an exact version; bump both together.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: run
        env:
          TZ: Asia/Jerusalem
          # Back to the API: it started working the moment the Instagram
          # account was linked to a Facebook Page, which is a hard
          # requirement we only satisfied on 28 Aug. The browser
          # publisher stays in the tree as the fallback — set the
          # PUBLISHER repo variable to 'browser' to switch back.
          PUBLISHER: ${{ vars.PUBLISHER || 'api' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
          # Which track this tick is. The Supabase cron sends
          # mode=stories on the hour and mode=digest three times a day;
          # a dispatch with no inputs is a digest.
          MODE: ${{ inputs.mode || 'digest' }}
          # ONE board, every ninety minutes — eleven a day instead of
          # fifty-one. Stories reach followers only, so volume there
          # buys nothing until there is an audience to retain; the
          # spacing is set by the cron, this is the belt.
          MAX_STORIES: '1'
          MIN_MINUTES_BETWEEN_STORIES: '80'
          MAX_STORIES_PER_DAY: '14'
          # A story is about the hour it belongs to. More than two
          # windows behind and it is news, not "now".
          MAX_STORY_LAG_WINDOWS: '2'
          # Three digests a day, in Asia/Jerusalem: the morning, half an
          # hour before the US open, and the evening. The hour gate is
          # in run.js, not in the cron expression, because pg_cron
          # thinks in UTC and Israel changes its clocks twice a year.
          DIGEST_HOURS: '8,15,21'
          IGNORE_SCHEDULE: ${{ inputs.now && '1' || '0' }}
          # Never set by the cron — a catch-up is always a decision.
          CATCHUP: ${{ inputs.catchup && '1' || '0' }}
          # A digest now covers everything since the last one, so the
          # merge-forward should never stop early: it absorbs every
          # closed window up to the one still filling.
          MIN_MESSAGES: '999'
          WINDOW_MINUTES: '60'
          # Windows run XX:15 -> XX+1:15; the tick fires at XX:16.
          WINDOW_OFFSET_MIN: '15'
          ACTIVE_FROM_HOUR: '7'
          ACTIVE_TO_HOUR: '24'
          MAX_POSTS_PER_DAY: '12'
          # Instagram's web composer starts refusing quietly when posts
          # come too fast. 35 minutes still clears a full backlog inside
          # a trading day and stays well under its patience.
          MIN_MINUTES_BETWEEN_POSTS: '35'
          # 0 = never retire. An unposted window waits its turn no
          # matter how old it is.
          MAX_WINDOW_AGE_MIN: '0'
          # A thin window waits this long for the next hour's news to
          # join it, then posts alone rather than waiting forever.
          WAIT_THIN_MIN: '180'
          PAUSE_AFTER_FAILURES: '2'
          # A pause that never expires is a silently dead agent.
          PAUSE_WINDOW_MIN: '180'
          RESUME: ${{ inputs.resume && '1' || '0' }}
          # Live: scheduled ticks publish on their own. The gate is
          # still here, one checkbox away — tick 'review' on a dispatch
          # to render an artifact without posting, or flip this default
          # to '1' to put every scheduled tick behind it again.
          REVIEW: ${{ inputs.review && '1' || '0' }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_SOURCE_CHANNEL: ${{ secrets.TG_SOURCE_CHANNEL }}
          TG_ALERT_TARGET: me
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: marketalert.il
          # A live instagram.com session, captured by login-ig.js.
          # Treat exactly like a password.
          IG_STORAGE_STATE: ${{ secrets.IG_STORAGE_STATE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: slides
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node src/run.js --ingest ${{ inputs.window && format('--window={0}', inputs.window) || '' }}

      # Only on failure, and only the rendered slides - never .env,
      # never state. Makes a broken deck inspectable after the fact.
      # Always now, not only on failure: the artifact IS the review
      # copy. PNG as well as JPEG - the browser publisher renders PNG.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: |
            out/**/*.png
            out/**/*.jpeg
            out/browser/**
          retention-days: 7
          if-no-files-found: ignore
